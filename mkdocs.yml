site_name: CryoEM Playbook
site_url: https://cryotud.github.io/cryoem-doeboek
site_author: Arjen Jakobi
site_description: >-
  CryoEM Playbook is a collection of interactive notebooks that illustrate core concepts in cryo-EM through practical, hands-on examples.
# Repository
repo_name: cryotud/cryoem-doeboek
repo_url: https://github.com/cryotud/cryoem-doeboek

# Copyright
copyright: >-
  &copy; 2026 Arjen Jakobi. Open educational resource: content
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>,
  code <a href="https://github.com/cryoTUD/cryoem-doeboek/blob/main/LICENSE-CODE">BSD-3-Clause</a>

theme:
  icon:
    logo: material/home-circle
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: light blue
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: blue grey
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode
  features:
    - navigation.instant
    - content.code.copy
    - content.code.select
    #- navigation.tabs
    #- navigation.top
    #- navigation.tracking
    - search.highlight
    - search.suggest
    # - toc.follow
    # - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.critic
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - pymdownx.arithmatex:
      generic: true


extra:
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >- 
            Thanks for your feedback! Help us improve this page by
            using our <a href="..." target="_blank" rel="noopener">feedback form</a>.

nav:
  - Introduction: index.md
  - Practicals:
      - Fourier analysis: fourier.md
      - Single-particle analysis: spa.md
      - Tomography: tomo.md
  - About CryoEM Playbook: about.md

plugins:
  - search
  - jupyterlite:
      notebook_patterns:
        - "**/*.ipynb"   # include all notebooks in jupyterlite; none are in nav

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
